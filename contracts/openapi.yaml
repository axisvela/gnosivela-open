openapi: 3.0.3
info:
  title: GNOSIVELA Semantic Control Plane API
  description: |
    GNOSIVELA is an Enterprise Semantic and Knowledge Fabric. This API manages
    ontologies, knowledge assertions, entity identity and grounding. The
    contract binds to semantic objects, never to a graph/vector/search vendor.
  version: 0.1.0
servers:
  - url: http://localhost:8080
tags:
  - name: ontology
  - name: assertion
  - name: entity
paths:
  /ontologies:
    post:
      summary: Create an ontology from DSL text or JSON
      tags: [ontology]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Ontology' }
          text/plain:
            schema: { type: string, example: "ontology procurement.supplier @version 1.2\n..." }
      responses:
        '201':
          description: Created (possibly with non-blocking issues)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OntologyCreateResult' }
        '422':
          description: Validation failed
    get:
      summary: List all ontologies
      tags: [ontology]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Ontology' }
  /ontologies/{namespace}/latest:
    get:
      summary: Get the latest version of a namespace
      tags: [ontology]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /ontologies/{namespace}/versions/{version}:
    get:
      summary: Get a specific ontology version
      tags: [ontology]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /ontologies/{namespace}/versions/{version}/publish:
    post:
      summary: Publish an ontology version after impact analysis
      description: Breaking changes require an approval token, otherwise the publish is refused with 409 and the impact report.
      tags: [ontology]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - { name: approval, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishResult' }
        '409':
          description: Blocked by breaking changes without approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImpactReport' }
  /ontologies/{namespace}/versions/{version}/deprecate:
    post:
      summary: Deprecate an ontology version
      tags: [ontology]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /ontologies/{namespace}/versions/{version}/rollback:
    post:
      summary: Roll back a published version
      description: Deprecates the version and returns the highest remaining published version. Both remain resolvable during the dual-read window.
      tags: [ontology]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Rolled back
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  toVersion: { type: string }
  /ontologies/{namespace}/versions/{version}/impact:
    get:
      summary: Analyse the impact of publishing a candidate version
      description: Compares the candidate against the latest published version and lists breaking/additive changes plus affected assertions and entities.
      tags: [ontology]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImpactReport' }
  /consistency/report:
    get:
      summary: Run rule validation and the seven consistency checks over the control plane
      description: Optionally pins an ontology namespace to enable structural and rule checks. Never mutates state.
      tags: [consistency]
      parameters:
        - { name: ontology, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsistencyReport' }
  /consistency/conflicts:
    get:
      summary: List detected groups of competing assertions
      tags: [consistency]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  conflicts:
                    type: array
                    items: { $ref: '#/components/schemas/Conflict' }
  /consistency/resolve:
    post:
      summary: Apply the resolution policy to all detected conflicts
      description: Winners stay untouched; losers are marked contested; ties are escalated without mutation. Every decision is audited.
      tags: [consistency]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  resolutions:
                    type: array
                    items: { $ref: '#/components/schemas/ConsistencyResolution' }
  /consistency/audit:
    get:
      summary: List the recorded resolution audit trail
      tags: [consistency]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  resolutions:
                    type: array
                    items: { $ref: '#/components/schemas/ConsistencyResolution' }
  /policy/policies:
    get:
      summary: List the registered fine-grained policies and engine status
      tags: [policy]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  policies:
                    type: array
                    items: { $ref: '#/components/schemas/Policy' }
  /policy/evaluate:
    post:
      summary: Evaluate a policy request (attributes -> allow/deny decision)
      tags: [policy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyDecision' }
        '409': { description: Policy engine disabled }
  /approval/requests:
    post:
      summary: Open an approval request for a governed action
      tags: [approval]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalCreate' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
    get:
      summary: List approval requests in creation order
      tags: [approval]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items: { $ref: '#/components/schemas/ApprovalRequest' }
  /approval/requests/{id}:
    get:
      summary: Get one approval request
      tags: [approval]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
  /approval/requests/{id}/approve:
    post:
      summary: Approve a pending step of an approval request
      tags: [approval]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalStep' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
  /approval/requests/{id}/reject:
    post:
      summary: Reject a pending step (settles the request as rejected)
      tags: [approval]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalStep' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
  /audit:
    get:
      summary: List the durable governance audit trail (chronological)
      tags: [audit]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntry' }
  /audit/attest:
    post:
      summary: Attest evidence by digest against an audit entry
      tags: [audit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditAttest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEntry' }
  /audit/verify:
    get:
      summary: Verify the tamper-evident audit hash chain
      description: Re-computes every entry digest and the chaining to previous entries; brokenAt is -1 when the whole trail is intact.
      tags: [audit]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  intact: { type: boolean }
                  brokenAt: { type: integer }
  /pipeline/run:
    post:
      summary: Run the mapping CI/CD closed loop (test -> publish -> observe -> rollback)
      description: Validates the version, gates on approval when required, publishes through the impact guard, observes consistency, and rolls back when the observe gate is exceeded and autoRollback is set.
      tags: [pipeline]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineReport' }
        '409':
          description: Blocked (approval required or breaking change without approval)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineReport' }
  /federation/query:
    post:
      summary: Run a federated semantic query across autonomous domains
      description: Distributes the query to every registered domain, merges corroborating assertions, and surfaces competing values as cross-domain conflicts (never merged).
      tags: [federation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FederatedQuery' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FederatedView' }
  /bridge/{namespace}/contract:
    get:
      summary: Export the signed semantic contract of the latest published ontology
      description: Downstream systems bind to this versioned contract (concepts, properties, units, JSON Schema, DDL, signature) instead of replicating private semantics.
      tags: [bridge]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BridgeContract' }
        '404': { description: No published ontology for the namespace }
  /bridge/query:
    post:
      summary: Run a contract-driven query filtered to the contract's declared predicates
      tags: [bridge]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BridgeQuery' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractView' }
  /events/contracts:
    get:
      summary: List registered event contracts
      tags: [event]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  contracts:
                    type: array
                    items: { $ref: '#/components/schemas/EventContract' }
    post:
      summary: Register an event contract (event type -> assertion templates)
      tags: [event]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventContract' }
      responses:
        '201': { description: Registered }
  /events/ingest:
    post:
      summary: Ingest an event and persist the governed assertions it produces
      description: Subjects are resolved to canonical entities; unresolved hints are stored under the unresolved namespace and reported as gaps. Assertions carry validity windows from the template's validFor.
      tags: [event]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventIngest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestResult' }
        '404': { description: Event contract not found }
  /metrics:
    get:
      summary: Operational counters (queries, publish, ingest, governance)
      description: Monotonic operation counters for SLO and monitoring. Keyed by stable names like query.semantic / ontology.publish / events.ingested.
      tags: [ops]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts:
                    type: object
                    additionalProperties: { type: integer }
                  asOf: { type: string, format: date-time }
  /metrics/definitions:
    get:
      summary: List governed metric definitions (Metric Ontology)
      description: Metrics are first-class objects (formula, grain, unit, source, owner, version) served to the semantic query executor.
      tags: [metric]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  definitions:
                    type: array
                    items: { $ref: '#/components/schemas/MetricDefinition' }
    post:
      summary: Register a governed metric definition
      tags: [metric]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetricDefinition' }
      responses:
        '201': { description: Registered }
        '409': { description: Duplicate metric id }
  /quality:
    get:
      summary: Aggregated quality/SLO snapshot over the control plane
      description: Citation completeness, unresolved-entity rate, consistency failures/warnings, conflict count and governance activity (audit + approval).
      tags: [ops]
      parameters:
        - { name: ontology, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityReport' }
  /incidents/rules:
    post:
      summary: Register an SLO rule (metric + operator + threshold)
      tags: [ops]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentRule' }
      responses:
        '201': { description: Registered }
  /incidents/check:
    post:
      summary: Evaluate SLO rules against the current quality snapshot
      description: Opens an incident only on the failing edge of a rule; a continuously failing rule does not re-open.
      tags: [ops]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  opened:
                    type: array
                    items: { $ref: '#/components/schemas/Incident' }
                  quality: { $ref: '#/components/schemas/QualityReport' }
  /incidents:
    get:
      summary: List incidents (newest first)
      tags: [ops]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  incidents:
                    type: array
                    items: { $ref: '#/components/schemas/Incident' }
  /incidents/{id}/resolve:
    post:
      summary: Resolve an open incident explicitly
      tags: [ops]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Resolved }
  /ontologies/{namespace}/versions/{version}/diff:
    get:
      summary: Semantic diff between two versions of a namespace
      tags: [ontology]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - { name: other, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes:
                    type: array
                    items: { $ref: '#/components/schemas/Change' }
  /assertions:
    post:
      summary: Propose a knowledge assertion
      tags: [assertion]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeAssertion' }
      responses:
        '201': { description: Created }
    get:
      summary: List assertions for a subject entity
      tags: [assertion]
      parameters:
        - { name: subjectNs, in: query, required: true, schema: { type: string } }
        - { name: subjectId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KnowledgeAssertion' }
  /assertions/{id}:
    get:
      summary: Get an assertion by id
      tags: [assertion]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /entities:
    post:
      summary: Register a canonical entity reference
      tags: [entity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntityRef' }
      responses:
        '201': { description: Created }
  /entities/resolve:
    post:
      summary: Resolve a hint to canonical entity references
      tags: [entity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hint: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EntityRef' }
  /entities/explain:
    post:
      summary: Resolve a hint into a full Resolution (canonical ref, match evidence, relations, gaps)
      tags: [entity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hint: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resolution' }
  /entities/merge-candidate:
    post:
      summary: Propose a merge candidate relation with match evidence (authority=candidate)
      tags: [entity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                left: { $ref: '#/components/schemas/EntityRef' }
                right: { $ref: '#/components/schemas/EntityRef' }
                kind: { type: string, enum: [exactSameAs, similarTo] }
                generatedBy: { type: string, enum: [rule, model, human] }
              required: [left, right]
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  relation: { $ref: '#/components/schemas/Relation' }
                  evidence: { $ref: '#/components/schemas/MatchEvidence' }
  /query/semantic:
    post:
      summary: "Semantic query: intent resolution + joint retrieval + KnowledgeView"
      tags: [query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string, example: "ACME supplier risk in Singapore" }
                principal: { type: string }
                purpose: { type: string, example: "supplier_onboarding" }
              required: [query]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SemanticResult' }
  /query/path:
    post:
      summary: Multi-hop path between two node keys
      tags: [query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from: { type: string, example: "policy:P-1" }
                to: { type: string, example: "process:PR-9" }
              required: [from, to]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Path' }
  /query/subgraph:
    post:
      summary: 1-hop neighborhood of a node
      tags: [query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                node: { type: string, example: "capability:C-2" }
              required: [node]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Relation' }
  /grounding/assemble:
    post:
      summary: Assemble an evidence-backed, purpose-scoped grounding bundle
      tags: [grounding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string, example: "ACME supplier risk in Singapore" }
                principal: { type: string }
                purpose: { type: string, example: "supplier_onboarding" }
                budget: { type: integer, description: "max assertions in knowledge (0 = unlimited)" }
              required: [query]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroundingBundle' }
  /grounding/explain:
    post:
      summary: Citation-level explanation of a grounding assembly
      tags: [grounding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string }
                principal: { type: string }
                purpose: { type: string }
              required: [query]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroundingExplanation' }
  /grounding/redact:
    post:
      summary: Re-assemble with sensitive evidence sources hidden, audit refs kept
      tags: [grounding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string }
                principal: { type: string }
                purpose: { type: string }
                budget: { type: integer }
                hideTags:
                  type: array
                  items: { type: string }
                  description: "policy tags whose evidence sources are redacted"
              required: [query]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroundingBundle' }
  /healthz:
    get:
      summary: Health check with backing store kind and read probe
      description: Returns 200 when healthy; 503 when the configured PostgreSQL store is unreachable.
      tags: [ops]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  store: { type: string, enum: [memory, postgres] }
                  version: { type: string }
                  storeError: { type: string }
        '503': { description: Store degraded }
components:
  schemas:
    Ontology:
      type: object
      properties:
        id: { type: string }
        namespace: { type: string }
        version: { type: string }
        dependencies: { type: array, items: { type: string } }
        status: { type: string, enum: [draft, validated, published, deprecated, revoked] }
        owner: { type: string }
        signature: { type: string }
        concepts:
          type: array
          items: { $ref: '#/components/schemas/Concept' }
        relations:
          type: array
          items: { $ref: '#/components/schemas/RelationSpec' }
        constraints:
          type: array
          items: { $ref: '#/components/schemas/Constraint' }
    OntologyCreateResult:
      type: object
      properties:
        ontology: { $ref: '#/components/schemas/Ontology' }
        issues:
          type: array
          items: { $ref: '#/components/schemas/Issue' }
    Concept:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        label: { type: string }
        definition: { type: string }
        scope: { type: string }
        owner: { type: string }
        properties:
          type: array
          items: { $ref: '#/components/schemas/Property' }
    Property:
      type: object
      properties:
        name: { type: string }
        dataType: { type: string }
        unit: { type: string }
        required: { type: boolean }
        cardinality: { type: string }
        enum: { type: array, items: { type: string } }
    RelationSpec:
      type: object
      properties:
        id: { type: string }
        domain: { type: string }
        range: { type: string }
        roles: { type: array, items: { type: string } }
        cardinality: { type: string }
        inverse: { type: string }
        properties: { type: array, items: { type: string } }
    Constraint:
      type: object
      properties:
        id: { type: string }
        target: { type: string }
        expression: { type: string }
        severity: { type: string, enum: [error, warning, info] }
