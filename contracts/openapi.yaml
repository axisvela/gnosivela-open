    MatchEvidence:
      type: object
      properties:
        left: { $ref: '#/components/schemas/EntityRef' }
        right: { $ref: '#/components/schemas/EntityRef' }
        score: { type: number }
        matchedOn: { type: array, items: { type: string } }
        generatedBy: { type: string }
        status: { type: string }
        capturedAt: { type: string, format: date-time }
    ResolvedMatch:
      type: object
      properties:
        ref: { $ref: '#/components/schemas/EntityRef' }
        score: { type: number }
        matchedOn: { type: array, items: { type: string } }
        status: { type: string }
    Resolution:
      type: object
      properties:
        hint: { type: string }
        canonical: { $ref: '#/components/schemas/EntityRef' }
        matches:
          type: array
          items: { $ref: '#/components/schemas/ResolvedMatch' }
        related:
          type: array
          items: { $ref: '#/components/schemas/Relation' }
        gaps: { type: array, items: { type: string } }
        asOf: { type: string, format: date-time }
    Intent:
      type: object
      properties:
        query: { type: string }
        concepts: { type: array, items: { type: string } }
        entities:
          type: array
          items: { $ref: '#/components/schemas/EntityRef' }
        relations: { type: array, items: { type: string } }
        region: { type: string }
        purpose: { type: string }
        tokens: { type: array, items: { type: string } }
    KnowledgeView:
      type: object
      properties:
        purpose: { type: string }
        principal: { type: string }
        asOf: { type: string, format: date-time }
        assertions:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeAssertion' }
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/Conflict' }
        gaps: { type: array, items: { type: string } }
    EvidenceChain:
      type: object
      properties:
        assertionId: { type: string }
        sources: { type: array, items: { type: string } }
        derivations: { type: array, items: { type: string } }
