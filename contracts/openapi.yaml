        entities: { type: integer }
        citationCompleteness: { type: number }
        unresolvedRate: { type: number }
        consistencyFailures: { type: integer }
        consistencyWarnings: { type: integer }
        conflicts: { type: integer }
        auditEntries: { type: integer }
        auditBlocked: { type: integer }
        approvalApproved: { type: integer }
        approvalRejected: { type: integer }
        approvalPending: { type: integer }
    IncidentRule:
      type: object
