openapi: 3.0.3
info:
  title: GNOSIVELA Semantic Control Plane API
  description: |
    GNOSIVELA is an Enterprise Semantic and Knowledge Fabric. This API manages
    ontologies, knowledge assertions, entity identity and grounding. The
    contract binds to semantic objects, never to a graph/vector/search vendor.
  version: 0.1.0
servers:
  - url: http://localhost:8080
tags:
  - name: ontology
  - name: assertion
  - name: entity
paths:
  /ontologies:
    post:
      summary: Create an ontology from DSL text or JSON
      tags: [ontology]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Ontology' }
          text/plain:
            schema: { type: string, example: "ontology procurement.supplier @version 1.2\n..." }
      responses:
        '201':
          description: Created (possibly with non-blocking issues)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OntologyCreateResult' }
        '422':
          description: Validation failed
    get:
      summary: List all ontologies
      tags: [ontology]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Ontology' }
  /ontologies/{namespace}/latest:
    get:
      summary: Get the latest version of a namespace
      tags: [ontology]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /ontologies/{namespace}/versions/{version}:
    get:
      summary: Get a specific ontology version
      tags: [ontology]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /ontologies/{namespace}/versions/{version}/publish:
    post:
      summary: Publish an ontology version after impact analysis
      description: Breaking changes require an approval token, otherwise the publish is refused with 409 and the impact report.
      tags: [ontology]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - { name: approval, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishResult' }
        '409':
          description: Blocked by breaking changes without approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImpactReport' }
  /ontologies/{namespace}/versions/{version}/deprecate:
    post:
      summary: Deprecate an ontology version
      tags: [ontology]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /ontologies/{namespace}/versions/{version}/rollback:
    post:
      summary: Roll back a published version
      description: Deprecates the version and returns the highest remaining published version. Both remain resolvable during the dual-read window.
      tags: [ontology]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Rolled back
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  toVersion: { type: string }
  /ontologies/{namespace}/versions/{version}/impact:
    get:
      summary: Analyse the impact of publishing a candidate version
      description: Compares the candidate against the latest published version and lists breaking/additive changes plus affected assertions and entities.
      tags: [ontology]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImpactReport' }
  /consistency/report:
    get:
      summary: Run rule validation and the seven consistency checks over the control plane
      description: Optionally pins an ontology namespace to enable structural and rule checks. Never mutates state.
      tags: [consistency]
      parameters:
        - { name: ontology, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsistencyReport' }
  /consistency/conflicts:
    get:
      summary: List detected groups of competing assertions
      tags: [consistency]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  conflicts:
                    type: array
                    items: { $ref: '#/components/schemas/Conflict' }
  /consistency/resolve:
    post:
      summary: Apply the resolution policy to all detected conflicts
      description: Winners stay untouched; losers are marked contested; ties are escalated without mutation. Every decision is audited.
      tags: [consistency]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  resolutions:
                    type: array
                    items: { $ref: '#/components/schemas/ConsistencyResolution' }
  /consistency/audit:
    get:
      summary: List the recorded resolution audit trail
      tags: [consistency]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  resolutions:
                    type: array
                    items: { $ref: '#/components/schemas/ConsistencyResolution' }
  /policy/policies:
    get:
      summary: List the registered fine-grained policies and engine status
      tags: [policy]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  policies:
                    type: array
                    items: { $ref: '#/components/schemas/Policy' }
  /policy/evaluate:
    post:
      summary: Evaluate a policy request (attributes -> allow/deny decision)
      tags: [policy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyDecision' }
        '409': { description: Policy engine disabled }
  /ontologies/{namespace}/versions/{version}/diff:
    get:
      summary: Semantic diff between two versions of a namespace
      tags: [ontology]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - { name: other, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes:
                    type: array
                    items: { $ref: '#/components/schemas/Change' }
  /assertions:
    post:
      summary: Propose a knowledge assertion
      tags: [assertion]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeAssertion' }
      responses:
        '201': { description: Created }
    get:
      summary: List assertions for a subject entity
      tags: [assertion]
      parameters:
        - { name: subjectNs, in: query, required: true, schema: { type: string } }
        - { name: subjectId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KnowledgeAssertion' }
  /assertions/{id}:
    get:
      summary: Get an assertion by id
      tags: [assertion]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /entities:
    post:
      summary: Register a canonical entity reference
      tags: [entity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntityRef' }
      responses:
        '201': { description: Created }
  /entities/resolve:
    post:
      summary: Resolve a hint to canonical entity references
      tags: [entity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hint: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EntityRef' }
  /entities/explain:
    post:
      summary: Resolve a hint into a full Resolution (canonical ref, match evidence, relations, gaps)
      tags: [entity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hint: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resolution' }
  /entities/merge-candidate:
    post:
      summary: Propose a merge candidate relation with match evidence (authority=candidate)
      tags: [entity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                left: { $ref: '#/components/schemas/EntityRef' }
                right: { $ref: '#/components/schemas/EntityRef' }
                kind: { type: string, enum: [exactSameAs, similarTo] }
                generatedBy: { type: string, enum: [rule, model, human] }
              required: [left, right]
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  relation: { $ref: '#/components/schemas/Relation' }
                  evidence: { $ref: '#/components/schemas/MatchEvidence' }
  /query/semantic:
    post:
      summary: "Semantic query: intent resolution + joint retrieval + KnowledgeView"
      tags: [query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string, example: "ACME supplier risk in Singapore" }
                principal: { type: string }
                purpose: { type: string, example: "supplier_onboarding" }
              required: [query]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SemanticResult' }
  /query/path:
    post:
      summary: Multi-hop path between two node keys
      tags: [query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from: { type: string, example: "policy:P-1" }
                to: { type: string, example: "process:PR-9" }
              required: [from, to]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Path' }
  /query/subgraph:
    post:
      summary: 1-hop neighborhood of a node
      tags: [query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                node: { type: string, example: "capability:C-2" }
              required: [node]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Relation' }
  /grounding/assemble:
    post:
      summary: Assemble an evidence-backed, purpose-scoped grounding bundle
      tags: [grounding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string, example: "ACME supplier risk in Singapore" }
                principal: { type: string }
                purpose: { type: string, example: "supplier_onboarding" }
                budget: { type: integer, description: "max assertions in knowledge (0 = unlimited)" }
              required: [query]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroundingBundle' }
  /grounding/explain:
    post:
      summary: Citation-level explanation of a grounding assembly
      tags: [grounding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string }
                principal: { type: string }
                purpose: { type: string }
              required: [query]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroundingExplanation' }
  /grounding/redact:
    post:
      summary: Re-assemble with sensitive evidence sources hidden, audit refs kept
      tags: [grounding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string }
                principal: { type: string }
                purpose: { type: string }
                budget: { type: integer }
                hideTags:
                  type: array
                  items: { type: string }
                  description: "policy tags whose evidence sources are redacted"
              required: [query]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroundingBundle' }
  /healthz:
    get:
      summary: Health check
      responses:
        '200': { description: OK }
components:
  schemas:
    Ontology:
      type: object
      properties:
        id: { type: string }
        namespace: { type: string }
        version: { type: string }
        dependencies: { type: array, items: { type: string } }
        status: { type: string, enum: [draft, validated, published, deprecated, revoked] }
        owner: { type: string }
        signature: { type: string }
        concepts:
          type: array
          items: { $ref: '#/components/schemas/Concept' }
        relations:
          type: array
          items: { $ref: '#/components/schemas/RelationSpec' }
        constraints:
          type: array
          items: { $ref: '#/components/schemas/Constraint' }
    OntologyCreateResult:
      type: object
      properties:
        ontology: { $ref: '#/components/schemas/Ontology' }
        issues:
          type: array
          items: { $ref: '#/components/schemas/Issue' }
    Concept:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        label: { type: string }
        definition: { type: string }
        scope: { type: string }
        owner: { type: string }
        properties:
          type: array
          items: { $ref: '#/components/schemas/Property' }
    Property:
      type: object
      properties:
        name: { type: string }
        dataType: { type: string }
        unit: { type: string }
        required: { type: boolean }
        cardinality: { type: string }
        enum: { type: array, items: { type: string } }
    RelationSpec:
      type: object
      properties:
        id: { type: string }
        domain: { type: string }
        range: { type: string }
        roles: { type: array, items: { type: string } }
        cardinality: { type: string }
        inverse: { type: string }
        properties: { type: array, items: { type: string } }
    Constraint:
      type: object
      properties:
        id: { type: string }
        target: { type: string }
        expression: { type: string }
        severity: { type: string, enum: [error, warning, info] }
        message: { type: string }
        version: { type: string }
    Issue:
      type: object
      properties:
        severity: { type: string, enum: [error, warning, info] }
        path: { type: string }
        message: { type: string }
    Change:
      type: object
      properties:
        kind: { type: string, enum: [added, removed, modified] }
        type: { type: string }
        id: { type: string }
        before: { type: string }
        after: { type: string }
        breaking: { type: boolean }
    AffectedAssertion:
      type: object
      properties:
        assertionId: { type: string }
        subject: { $ref: '#/components/schemas/EntityRef' }
        predicate: { type: string }
        ontologyVersion: { type: string }
        reason: { type: string }
    ImpactSummary:
      type: object
      properties:
        changes: { type: integer }
        breaking: { type: integer }
        additive: { type: integer }
        deprecations: { type: integer }
        affectedAssertions: { type: integer }
        affectedEntities: { type: integer }
    ImpactReport:
      type: object
      properties:
        namespace: { type: string }
        fromVersion: { type: string }
        toVersion: { type: string }
        breaking: { type: array, items: { $ref: '#/components/schemas/Change' } }
        additive: { type: array, items: { $ref: '#/components/schemas/Change' } }
        deprecations: { type: array, items: { $ref: '#/components/schemas/Change' } }
        affectedAssertions: { type: array, items: { $ref: '#/components/schemas/AffectedAssertion' } }
        affectedEntities: { type: array, items: { $ref: '#/components/schemas/EntityRef' } }
        blocking: { type: boolean }
    PublishResult:
      type: object
      properties:
        status: { type: string }
        impact: { $ref: '#/components/schemas/ImpactSummary' }
    RuleResult:
      type: object
      properties:
        constraintId: { type: string }
        expression: { type: string }
        assertionId: { type: string }
        passed: { type: boolean }
        severity: { type: string }
        message: { type: string }
    CheckResult:
      type: object
      properties:
        type: { type: string, enum: [lexical, identity, structural, temporal, contextual, inferential, authority] }
        severity: { type: string, enum: [error, warning, info] }
        message: { type: string }
        ref: { type: string }
    ConsistencyReport:
      type: object
      properties:
        rules: { type: array, items: { $ref: '#/components/schemas/RuleResult' } }
        checks: { type: array, items: { $ref: '#/components/schemas/CheckResult' } }
        failures: { type: integer }
        warnings: { type: integer }
    ConsistencyResolution:
      type: object
      properties:
        at: { type: string, format: date-time }
        subject: { $ref: '#/components/schemas/EntityRef' }
        predicate: { type: string }
        winner: { type: string }
        loser: { type: string }
        basis: { type: string }
        escalated: { type: boolean }
        ties: { type: array, items: { type: string } }
    Condition:
      type: object
      properties:
        field: { type: string }
        op: { type: string, enum: [eq, neq, in] }
        values: { type: array, items: { type: string } }
    Policy:
      type: object
      properties:
        id: { type: string }
        effect: { type: string, enum: [allow, deny] }
        actions: { type: array, items: { type: string } }
        resources: { type: array, items: { type: string } }
        conditions: { type: array, items: { $ref: '#/components/schemas/Condition' } }
        callout: { type: string }
    PolicyRequest:
      type: object
      properties:
        principal: { type: string }
        action: { type: string }
        resource: { type: string }
        tenant: { type: string }
        region: { type: string }
        attributes: { type: object, additionalProperties: { type: string } }
      required: [action]
    PolicyDecision:
      type: object
      properties:
        allowed: { type: boolean }
        reason: { type: string }
        policies: { type: array, items: { type: string } }
    EntityRef:
      type: object
      properties:
        namespace: { type: string }
        canonicalId: { type: string }
        type: { type: string }
        aliases: { type: array, items: { type: string } }
        authority: { type: string }
      required: [namespace, canonicalId]
    Relation:
      type: object
      properties:
        id: { type: string }
        from: { $ref: '#/components/schemas/EntityRef' }
        to: { $ref: '#/components/schemas/EntityRef' }
        kind: { type: string, enum: [exactSameAs, legallyRepresents, operationalAlias, memberOf, partOf, derivedFrom, similarTo] }
        authority: { type: string }
    MatchEvidence:
      type: object
      properties:
        left: { $ref: '#/components/schemas/EntityRef' }
        right: { $ref: '#/components/schemas/EntityRef' }
        score: { type: number }
        matchedOn: { type: array, items: { type: string } }
        generatedBy: { type: string }
        status: { type: string }
        capturedAt: { type: string, format: date-time }
    ResolvedMatch:
      type: object
      properties:
        ref: { $ref: '#/components/schemas/EntityRef' }
        score: { type: number }
        matchedOn: { type: array, items: { type: string } }
        status: { type: string }
    Resolution:
      type: object
      properties:
        hint: { type: string }
        canonical: { $ref: '#/components/schemas/EntityRef' }
        matches:
          type: array
          items: { $ref: '#/components/schemas/ResolvedMatch' }
        related:
          type: array
          items: { $ref: '#/components/schemas/Relation' }
        gaps: { type: array, items: { type: string } }
        asOf: { type: string, format: date-time }
    Intent:
      type: object
      properties:
        query: { type: string }
        concepts: { type: array, items: { type: string } }
        entities:
          type: array
          items: { $ref: '#/components/schemas/EntityRef' }
        relations: { type: array, items: { type: string } }
        region: { type: string }
        purpose: { type: string }
        tokens: { type: array, items: { type: string } }
    KnowledgeView:
      type: object
      properties:
        purpose: { type: string }
        principal: { type: string }
        asOf: { type: string, format: date-time }
        assertions:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeAssertion' }
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/Conflict' }
        gaps: { type: array, items: { type: string } }
    EvidenceChain:
      type: object
      properties:
        assertionId: { type: string }
        sources: { type: array, items: { type: string } }
        derivations: { type: array, items: { type: string } }
    PathStep:
      type: object
      properties:
        from: { type: string }
        relation: { type: string }
        to: { type: string }
    Path:
      type: object
      properties:
        nodes: { type: array, items: { type: string } }
        steps:
          type: array
          items: { $ref: '#/components/schemas/PathStep' }
        explanations: { type: array, items: { type: string } }
    SemanticResult:
      type: object
      properties:
        intent: { $ref: '#/components/schemas/Intent' }
        view: { $ref: '#/components/schemas/KnowledgeView' }
        relations:
          type: array
          items: { $ref: '#/components/schemas/Relation' }
        paths:
          type: array
          items: { $ref: '#/components/schemas/Path' }
        evidenceChains:
          type: array
          items: { $ref: '#/components/schemas/EvidenceChain' }
        metrics:
          type: array
          items: { $ref: '#/components/schemas/MetricDefinition' }
    MetricDefinition:
      type: object
      properties:
        id: { type: string }
        formula: { type: string }
        dimensions: { type: array, items: { type: string } }
        grain: { type: string }
        unit: { type: string }
        source: { type: string }
        owner: { type: string }
        version: { type: string }
      required: [id]
    KnowledgeAssertion:
      type: object
      properties:
        assertionId: { type: string }
        subject: { $ref: '#/components/schemas/EntityRef' }
        predicate: { type: string }
        object:
          type: object
          properties:
            type: { type: string, enum: [entity, string, number, boolean, date] }
            entityRef: { $ref: '#/components/schemas/EntityRef' }
            string: { type: string }
            number: { type: number }
            boolean: { type: boolean }
        context:
          type: object
          properties:
            domain: { type: string }
            region: { type: string }
            contract: { type: string }
            scenario: { type: string }
            purpose: { type: string }
            tags: { type: array, items: { type: string } }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        source: { type: string }
        authority: { type: string }
        confidence: { type: number }
        status: { type: string, enum: [proposed, validated, contested, superseded, revoked] }
        policyTags: { type: array, items: { type: string } }
        ontologyVersion: { type: string }
      required: [subject, predicate]
    EvidenceRef:
      type: object
      properties:
        source: { type: string }
        artifactDigest: { type: string }
        locator: { type: string }
        capturedAt: { type: string, format: date-time }
        principal: { type: string }
      required: [source]
    SemanticContract:
      type: object
      properties:
        ontologyVersion: { type: string }
        mappingVersion: { type: string }
        units: { type: array, items: { type: string } }
    GroundingBundle:
      type: object
      properties:
        resolvedIntent: { type: string }
        knowledge:
          type: array
