          type: array
          items: { $ref: '#/components/schemas/KnowledgeAssertion' }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/EvidenceRef' }
        semanticContract: { $ref: '#/components/schemas/SemanticContract' }
        policyDecision: { type: string }
        conflict:
          type: array
          items: { $ref: '#/components/schemas/Conflict' }
        gap: { type: array, items: { type: string } }
        contextBudget: { type: integer }
      required: [resolvedIntent]
    Conflict:
      type: object
      properties:
        reason: { type: string }
        subject: { $ref: '#/components/schemas/EntityRef' }
        predicate: { type: string }
        assertions:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeAssertion' }
    GroundingCitation:
      type: object
      properties:
        assertionId: { type: string }
        subject: { type: string }
        predicate: { type: string }
        status: { type: string }
        confidence: { type: number }
        ontologyVersion: { type: string }
        sources: { type: array, items: { type: string } }
        derivations: { type: array, items: { type: string } }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/EvidenceRef' }
    GroundingExplanation:
      type: object
      properties:
        intent: { type: string }
        citations:
          type: array
          items: { $ref: '#/components/schemas/GroundingCitation' }
        conflicts: { type: array, items: { type: string } }
        gaps: { type: array, items: { type: string } }
        policy: { type: string }
        citationCompleteness: { type: number }
    HybridWeights:
      type: object
      properties:
        lexical: { type: number, default: 1 }
        vector: { type: number, default: 1 }
        graph: { type: number, default: 0.5 }
    HybridHit:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [concept, assertion] }
        text: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
        score: { type: number }
        lexicalScore: { type: number }
        vectorScore: { type: number }
        graphScore: { type: number }
        lexicalRank: { type: integer }
        vectorRank: { type: integer }
        graphRank: { type: integer }
      required: [id, score]
    HybridResult:
      type: object
      properties:
        query: { type: string }
        provider: { type: string }
        fusion: { type: string, enum: [rrf] }
        weights: { $ref: '#/components/schemas/HybridWeights' }
        hits:
          type: array
          items: { $ref: '#/components/schemas/HybridHit' }
        lexicalCandidates: { type: integer }
        vectorCandidates: { type: integer }
        graphCandidates: { type: integer }
      required: [query, fusion, hits]
    MCPRequest:
      type: object
      properties:
        jsonrpc: { type: string, enum: ['2.0'] }
        id:
          oneOf:
            - { type: string }
            - { type: integer }
        method: { type: string, example: tools/call }
        params:
          type: object
          additionalProperties: true
      required: [jsonrpc, method]
    MCPError:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data: {}
      required: [code, message]
    MCPResponse:
      type: object
      properties:
        jsonrpc: { type: string, enum: ['2.0'] }
        id:
          oneOf:
            - { type: string }
            - { type: integer }
        result:
          type: object
          additionalProperties: true
        error: { $ref: '#/components/schemas/MCPError' }
      required: [jsonrpc]
    ConnectorInfo:
      type: object
      properties:
        kind: { type: string, enum: [relational, catalog, api, streaming, objectstore, warehouse, snowflake, iceberg, salesforce, sharepoint, glue] }
        description: { type: string }
      required: [kind]
    ConnectorSpec:
      type: object
      properties:
        id: { type: string }
        driver: { type: string, description: "database/sql driver (relational)" }
        dsn: { type: string }
        name: { type: string }
        options:
          type: object
          additionalProperties: { type: string }
          description: "url/schema for api, inlineSchema/schemaName for streaming, table/schema for relational. Private schema URLs require allowPrivate=true (SSRF guard)."
    ConnectorIntrospect:
      type: object
      properties:
        kind: { type: string, enum: [relational, catalog, api, streaming, objectstore, warehouse, snowflake, iceberg, salesforce, sharepoint, glue] }
        spec: { $ref: '#/components/schemas/ConnectorSpec' }
      required: [kind, spec]
    SourceField:
      type: object
      properties:
        name: { type: string }
        dataType: { type: string }
        required: { type: boolean }
        primaryKey: { type: boolean }
      required: [name, dataType]
    SourceSchema:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        name: { type: string }
        namespace: { type: string }
        fields:
          type: array
          items: { $ref: '#/components/schemas/SourceField' }
        connector: { type: string }
        retrievedAt: { type: string, format: date-time }
      required: [kind, fields, connector]
    MappingRule:
      type: object
      properties:
        sourceField: { type: string }
        concept: { type: string }
        property: { type: string }
        transform: { type: string }
        confidence: { type: number }
      required: [sourceField, concept, property]
    MappingSet:
      type: object
      properties:
        id: { type: string }
        sourceSchema: { type: string }
        rules:
          type: array
          items: { $ref: '#/components/schemas/MappingRule' }
        version: { type: string }
        status: { type: string, enum: [draft, tested, published, deprecated] }
        updatedAt: { type: string, format: date-time }
      required: [version, rules]
    ColumnLineageRequest:
      type: object
      properties:
        schema: { $ref: '#/components/schemas/SourceSchema' }
        mapping: { $ref: '#/components/schemas/MappingSet' }
      required: [schema, mapping]
    ColumnLineage:
      type: object
      properties:
        sourceField: { type: string }
        dataType: { type: string }
        targetConcept: { type: string }
        targetProperty: { type: string }
        transform: { type: string }
        confidence: { type: number }
        status: { type: string, enum: [mapped, unmapped] }
      required: [sourceField, status]
    ColumnLineageReport:
      type: object
      properties:
        sourceSchema: { type: string }
        mappingId: { type: string }
        mappingVersion: { type: string }
        columns:
          type: array
          items: { $ref: '#/components/schemas/ColumnLineage' }
        unmapped:
          type: array
          items: { type: string }
        orphans:
          type: array
          items: { $ref: '#/components/schemas/MappingRule' }
      required: [sourceSchema, columns]
    DocumentBindingRequest:
      type: object
      properties:
        docId: { type: string }
        uri: { type: string }
        version: { type: string }
        contentType: { type: string, enum: [markdown, text, html, application/pdf, image/png, image/jpeg, image/tiff], description: "Content format; default markdown. Binary types require contentEncoding=base64 and an OCR provider." }
        contentEncoding: { type: string, enum: [utf-8, base64], description: "Content encoding; default utf-8" }
        content: { type: string }
        extractClaims: { type: boolean }
        extractor: { $ref: '#/components/schemas/DocumentExtractor' }
        ocr: { $ref: '#/components/schemas/DocumentOCR' }
      required: [docId, content]
    DocumentExtractor:
      type: object
      description: Claim extraction provider. The built-in keyword provider is used when omitted.
      properties:
        kind: { type: string, enum: [keyword, http], description: "Extractor kind; default keyword" }
        url: { type: string, description: "HTTP IE provider endpoint (kind=http)" }
        token: { type: string, description: "Optional Bearer token for the HTTP provider" }
        allowPrivate: { type: boolean, description: "Allow loopback/private provider addresses" }
      required: [kind]
    DocumentOCR:
      type: object
      description: OCR provider for binary document bindings. The original bytes are sent as base64; artifactDigest remains the digest of those bytes.
      properties:
        kind: { type: string, enum: [http], description: "OCR kind; http" }
        url: { type: string, description: "HTTP OCR provider endpoint" }
        token: { type: string, description: "Optional Bearer token for the HTTP provider" }
        language: { type: string, description: "Optional OCR language hint" }
        allowPrivate: { type: boolean, description: "Allow loopback/private provider addresses" }
      required: [kind, url]
    DocumentChunk:
      type: object
      properties:
        id: { type: string }
        docId: { type: string }
        heading: { type: string }
        content: { type: string }
        order: { type: integer }
        locator: { type: string }
      required: [id, docId, content, locator]
    ClaimCandidate:
      type: object
      properties:
        id: { type: string }
        chunkId: { type: string }
        text: { type: string }
        predicate: { type: string }
        subjectHint: { type: string }
        status: { type: string, enum: [extracted, mapped, validated, published, contested, superseded, revoked] }
        confidence: { type: number }
        evidence: { $ref: '#/components/schemas/EvidenceRef' }
      required: [id, chunkId, text, status]
    DocumentBinding:
      type: object
      properties:
        id: { type: string }
        docId: { type: string }
        uri: { type: string }
        version: { type: string }
        artifactDigest: { type: string, description: SHA-256 of the bound document content }
        capturedAt: { type: string, format: date-time }
        chunks:
          type: array
          items: { $ref: '#/components/schemas/DocumentChunk' }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/ClaimCandidate' }
        bindingState: { type: string }
      required: [id, docId, bindingState]
    StudioProperty:
      type: object
      properties:
        name: { type: string }
        dataType: { type: string }
        unit: { type: string }
        required: { type: boolean }
        cardinality: { type: string }
      required: [name, dataType]
    StudioConcept:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        definition: { type: string }
        scope: { type: string }
        owner: { type: string }
        deprecatedBy: { type: string }
        properties:
          type: array
          items: { $ref: '#/components/schemas/StudioProperty' }
        assertionCount: { type: integer }
        entityCount: { type: integer }
      required: [id]
    StudioRelation:
      type: object
      properties:
        id: { type: string }
        domain: { type: string }
        range: { type: string }
        cardinality: { type: string }
      required: [id]
    StudioSource:
      type: object
      properties:
        source: { type: string }
        count: { type: integer }
      required: [source, count]
    StudioModel:
      type: object
      properties:
        namespace: { type: string }
        version: { type: string }
        status: { type: string }
        publishedVersion: { type: string }
        owner: { type: string }
        concepts:
          type: array
          items: { $ref: '#/components/schemas/StudioConcept' }
        relations:
          type: array
          items: { $ref: '#/components/schemas/StudioRelation' }
        dependencies: { type: array, items: { type: string } }
        assertionCount: { type: integer }
        entityCount: { type: integer }
        statusCounts:
          type: object
          additionalProperties: { type: integer }
        sources:
          type: array
          items: { $ref: '#/components/schemas/StudioSource' }
        impact: { $ref: '#/components/schemas/StudioImpact' }
      required: [namespace, version, status, concepts, relations]
    StudioImpact:
      type: object
      properties:
        fromVersion: { type: string }
        toVersion: { type: string }
        breaking: { type: integer }
        additive: { type: integer }
        deprecations: { type: integer }
        affectedAssertions: { type: integer }
        affectedEntities: { type: integer }
        blocking: { type: boolean }
      required: [toVersion, breaking, additive, blocking]
    ActionDefinition:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [webhook, function] }
        url: { type: string }
        method: { type: string, enum: [POST, PUT, PATCH] }
        headers:
          type: object
          additionalProperties: { type: string }
        timeoutSeconds: { type: integer }
        requiresApproval: { type: boolean }
        approvalAction: { type: string, description: "default action.run" }
        allowPrivate: { type: boolean }
        enabled: { type: boolean }
        schedule: { type: string, description: "Go duration (e.g. 5m) or 5-field cron (e.g. */5 * * * *); empty = manual only" }
        schedulePrincipal: { type: string, description: "Principal for scheduled runs (default system)" }
        scheduleInput: { description: "JSON payload for scheduled runs" }
      required: [id, kind, url]
    ActionRunRequest:
      type: object
      properties:
        principal: { type: string }
        approvalId: { type: string }
        input: {}
    ActionRun:
      type: object
      properties:
        id: { type: string }
        actionId: { type: string }
        principal: { type: string }
        approvalId: { type: string }
        status: { type: string, enum: [succeeded, failed, blocked] }
        statusCode: { type: integer }
        error: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        durationMillis: { type: integer }
        output: { description: "JSON output for function actions" }
        storeError: { type: string, description: "Set when durable run persistence failed" }
      required: [id, actionId, status]
    ShaclValidationReport:
      type: object
      properties:
        conforms: { type: boolean }
        results:
          type: array
          items: { $ref: '#/components/schemas/ShaclViolation' }
      required: [conforms, results]
    ShaclViolation:
      type: object
      properties:
        assertionId: { type: string }
        subject: { type: string }
        path: { type: string }
        constraint: { type: string, enum: [minCount, maxCount, datatype, enum, class] }
        severity: { type: string }
        message: { type: string }
      required: [constraint, severity, message]
    GraphQLRequest:
      type: object
      properties:
        query: { type: string }
        variables:
          type: object
          additionalProperties: true
      required: [query]
    GraphQLResponse:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
        errors:
          type: array
          items: { type: string }
    SparqlTerm:
      type: object
      properties:
        type: { type: string, enum: [uri, literal, bnode] }
        value: { type: string }
        datatype: { type: string }
      required: [type, value]
    SparqlResult:
      type: object
      properties:
        head:
          type: object
          properties:
            vars: { type: array, items: { type: string } }
          required: [vars]
        results:
          type: object
          properties:
            bindings:
              type: array
              items:
                type: object
                additionalProperties: { $ref: '#/components/schemas/SparqlTerm' }
          required: [bindings]
      required: [head, results]
