openapi: 3.0.3
info:
  title: GNOSIVELA Semantic Control Plane API
  description: |
    GNOSIVELA is an Enterprise Semantic and Knowledge Fabric. This API manages
    ontologies, knowledge assertions, entity identity and grounding. The
    contract binds to semantic objects, never to a graph/vector/search vendor.
  version: 0.1.0
servers:
  - url: http://localhost:1836
tags:
  - name: ontology
  - name: assertion
  - name: entity
paths:
  /ontologies:
    post:
      summary: Create an ontology from DSL text or JSON
      tags: [ontology]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Ontology' }
          text/plain:
            schema: { type: string, example: "ontology procurement.supplier @version 1.2\n..." }
      responses:
        '201':
          description: Created (possibly with non-blocking issues)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OntologyCreateResult' }
        '422':
          description: Validation failed
    get:
      summary: List all ontologies
      tags: [ontology]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Ontology' }
  /ontologies/{namespace}/latest:
    get:
      summary: Get the latest version of a namespace
      tags: [ontology]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /ontologies/{namespace}/versions/{version}:
    get:
      summary: Get a specific ontology version
      tags: [ontology]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /ontologies/{namespace}/versions/{version}/publish:
    post:
      summary: Publish an ontology version after impact analysis
      description: Breaking changes require an approval token, otherwise the publish is refused with 409 and the impact report.
      tags: [ontology]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - { name: approval, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishResult' }
        '409':
          description: Blocked by breaking changes without approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImpactReport' }
  /ontologies/{namespace}/versions/{version}/deprecate:
    post:
      summary: Deprecate an ontology version
      tags: [ontology]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /ontologies/{namespace}/versions/{version}/rollback:
    post:
      summary: Roll back a published version
      description: Deprecates the version and returns the highest remaining published version. Both remain resolvable during the dual-read window.
      tags: [ontology]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Rolled back
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  toVersion: { type: string }
  /ontologies/{namespace}/versions/{version}/impact:
    get:
      summary: Analyse the impact of publishing a candidate version
      description: Compares the candidate against the latest published version and lists breaking/additive changes plus affected assertions and entities.
      tags: [ontology]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImpactReport' }
  /consistency/report:
    get:
      summary: Run rule validation and the seven consistency checks over the control plane
      description: Optionally pins an ontology namespace to enable structural and rule checks. Never mutates state.
      tags: [consistency]
      parameters:
        - { name: ontology, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsistencyReport' }
  /consistency/conflicts:
    get:
      summary: List detected groups of competing assertions
      tags: [consistency]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  conflicts:
                    type: array
                    items: { $ref: '#/components/schemas/Conflict' }
  /consistency/resolve:
    post:
      summary: Apply the resolution policy to all detected conflicts
      description: Winners stay untouched; losers are marked contested; ties are escalated without mutation. Every decision is audited.
      tags: [consistency]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  resolutions:
                    type: array
                    items: { $ref: '#/components/schemas/ConsistencyResolution' }
  /consistency/audit:
    get:
      summary: List the recorded resolution audit trail
      tags: [consistency]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  resolutions:
                    type: array
                    items: { $ref: '#/components/schemas/ConsistencyResolution' }
  /policy/policies:
    get:
      summary: List the registered fine-grained policies and engine status
      tags: [policy]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  policies:
                    type: array
                    items: { $ref: '#/components/schemas/Policy' }
  /policy/evaluate:
    post:
      summary: Evaluate a policy request (attributes -> allow/deny decision)
      tags: [policy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyDecision' }
        '409': { description: Policy engine disabled }
  /approval/requests:
    post:
      summary: Open an approval request for a governed action
      tags: [approval]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalCreate' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
    get:
      summary: List approval requests in creation order
      tags: [approval]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items: { $ref: '#/components/schemas/ApprovalRequest' }
  /approval/requests/{id}:
    get:
      summary: Get one approval request
      tags: [approval]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
  /approval/requests/{id}/approve:
    post:
      summary: Approve a pending step of an approval request
      tags: [approval]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalStep' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
  /approval/requests/{id}/reject:
    post:
      summary: Reject a pending step (settles the request as rejected)
      tags: [approval]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalStep' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
  /audit:
    get:
      summary: List the durable governance audit trail (chronological)
      description: Optional filters by actor, action and resource.
      tags: [audit]
      parameters:
        - { name: actor, in: query, required: false, schema: { type: string } }
        - { name: action, in: query, required: false, schema: { type: string } }
        - { name: resource, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntry' }
  /audit/attest:
    post:
      summary: Attest evidence by digest against an audit entry
      tags: [audit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditAttest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEntry' }
  /audit/verify:
    get:
      summary: Verify the tamper-evident audit hash chain
      description: Re-computes every entry digest and the chaining to previous entries; brokenAt is -1 when the whole trail is intact.
      tags: [audit]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  intact: { type: boolean }
                  brokenAt: { type: integer }
  /pipeline/run:
    post:
      summary: Run the mapping CI/CD closed loop (test -> publish -> observe -> rollback)
      description: Validates the version, gates on approval when required, publishes through the impact guard, observes consistency, and rolls back when the observe gate is exceeded and autoRollback is set.
      tags: [pipeline]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineReport' }
        '409':
          description: Blocked (approval required or breaking change without approval)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineReport' }
  /federation/query:
    post:
      summary: Run a federated semantic query across autonomous domains
      description: Distributes the query to every registered domain (local and remote), merges corroborating assertions, and surfaces competing values as cross-domain conflicts (never merged).
      tags: [federation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FederatedQuery' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FederatedView' }
  /federation/domains:
    get:
      summary: List the registered federated domains
      tags: [federation]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  domains:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        type: { type: string, enum: [local, remote] }
                        baseUrl: { type: string }
    post:
      summary: Register a remote federated domain (HTTP control-plane endpoint)
      tags: [federation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                baseUrl: { type: string }
              required: [name, baseUrl]
      responses:
        '201': { description: Registered }
  /connectors:
    get:
      summary: List registered semantic source connectors
      description: Connectors are semantic binders, not replicators; they read source schemas only and never copy data into the control plane.
      tags: [connector]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  connectors:
                    type: array
                    items: { $ref: '#/components/schemas/ConnectorInfo' }
  /connectors/introspect:
    post:
      summary: Introspect an external source into a SourceSchema
      description: |
        Supported kinds are `relational`, `catalog`, `api`, `streaming`,
        `objectstore`, `warehouse`, `snowflake`, `iceberg`, `salesforce` and
        `sharepoint`, `glue`. `api` reads an OpenAPI 3 / JSON Schema document from
        `spec.options.url` and selects `spec.options.schema`; `streaming`
        accepts an inline JSON Schema (`spec.options.inlineSchema`) or a Schema
        Registry subject (`spec.options.subject`); `objectstore` lists an
        S3-compatible bucket and infers a schema from a sample object;
        `warehouse` introspects a Databricks Unity Catalog table; `snowflake`
        runs `DESCRIBE TABLE` through the Snowflake SQL API; `iceberg` reads an
        Iceberg REST Catalog table; `salesforce` reads an sObject describe;
        `sharepoint` reads list columns through Microsoft Graph; `glue` reads an
        AWS Glue Data Catalog table with SigV4. Only schemas and metadata are
        read, never records or data files.
      tags: [connector]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectorIntrospect' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceSchema' }
        '404': { description: Unknown connector kind }
        '422': { description: Introspection failed (invalid schema or upstream error) }
  /connectors/documents:
    post:
      summary: Bind a markdown, text or HTML document into citation-preserving chunks and claim candidates
      description: The source document is not copied into GNOSIVELA; only chunk locators, bindings and extracted candidates are returned. HTML scripts/styles are dropped and entities decoded. Claim extraction defaults to the built-in keyword provider; an external HTTP IE provider can be selected per binding. PDF/image inputs are base64-encoded and processed by an external OCR provider; the artifactDigest covers the original bytes.
      tags: [connector]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentBindingRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentBinding' }
        '400': { description: Missing docId or content }
  /lineage/columns:
    post:
      summary: Analyze column-level mapping lineage
      description: Maps each source column to its ontology target and reports unmapped columns and orphan mapping rules. Only metadata is analyzed; source data is never read.
      tags: [connector]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ColumnLineageRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ColumnLineageReport' }
        '400': { description: Invalid schema or mapping }
  /actions:
    get:
      summary: List governed actions (webhook / function runtime)
      description: Actions can be webhook side effects or external JSON functions. Both are approval-bound when required and fully audited.
      tags: [action]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items: { $ref: '#/components/schemas/ActionDefinition' }
    post:
      summary: Register a governed webhook or function action
      tags: [action]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionDefinition' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionDefinition' }
        '400': { description: Invalid definition }
  /actions/{id}/run:
    post:
      summary: Run an action (approval-bound when required, fully audited)
      description: |
        Webhook actions run with a timeout and an SSRF guard (private targets
        require `allowPrivate`). When `requiresApproval` is set, a fully
        approved `action.run` request for the same resource is required.
        Every attempt is recorded in the audit hash-chain.
      tags: [action]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionRunRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionRun' }
        '404': { description: Action not found }
        '409': { description: Approval required or action disabled }
        '502': { description: Webhook failed (run record included) }
  /actions/runs:
    get:
      summary: List action invocation records (newest first)
      tags: [action]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items: { $ref: '#/components/schemas/ActionRun' }
  /sparql:
    get:
      summary: Read-only SPARQL 1.1 subset (SELECT / ASK / CONSTRUCT)
      description: |
        Supports SELECT (DISTINCT, ORDER BY, LIMIT, OFFSET, expressions with
        AS),         ASK and CONSTRUCT, GROUP BY/HAVING with COUNT/SUM/AVG/MIN/MAX/
        SAMPLE/GROUP_CONCAT, basic graph patterns, property paths (sequence,
        alternative, inverse, negation, *, +, ?), OPTIONAL, UNION, MINUS,
        BIND, VALUES, subqueries, PREFIX and FILTER expressions (comparison,
        &&/||/!, IN, BOUND, REGEX, STR/LANG/DATATYPE,
        CONTAINS/STRSTARTS/STRENDS/STRLEN) over assertions and rdf:type
        triples. SERVICE delegates a group to a remote SPARQL endpoint (SILENT
        supported); loopback/private endpoints are refused, responses are size
        and time bounded. Named graphs (GRAPH <iri> / GRAPH ?g) are derived
        from assertion context domains (`https://gnosivela.dev/graph/<domain>`,
        default `.../graph/default`); outside GRAPH the dataset is the union of
        all graphs. CONSTRUCT returns Turtle; SELECT/ASK return SPARQL JSON.
      tags: [interop]
      parameters:
        - { name: query, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/sparql-results+json:
              schema: { $ref: '#/components/schemas/SparqlResult' }
            text/turtle:
              schema: { type: string }
        '400': { description: Query missing or unsupported }
    post:
      summary: Read-only SPARQL 1.1 subset (SELECT / ASK / CONSTRUCT) via body
      tags: [interop]
      requestBody:
        required: true
        content:
          application/sparql-query:
            schema: { type: string }
          text/plain:
            schema: { type: string }
          application/json:
            schema:
              type: object
              properties:
                query: { type: string }
              required: [query]
      responses:
        '200':
          content:
            application/sparql-results+json:
              schema: { $ref: '#/components/schemas/SparqlResult' }
            text/turtle:
              schema: { type: string }
        '400': { description: Query missing or unsupported }
  /graphql:
    get:
      summary: Read-only GraphQL query via query parameter
      description: |
        Read-only ontology/knowledge facade. Supports the Query fields
        ontology, ontologies, concepts, entities and assertions. Mutations,
        subscriptions and fragments are rejected. Field-level execution
        errors are returned in `errors` alongside partial data.
      tags: [interop]
      parameters:
        - { name: query, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphQLResponse' }
        '400': { description: Invalid or unsupported query }
    post:
      summary: Read-only GraphQL query
      tags: [interop]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GraphQLRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphQLResponse' }
        '400': { description: Invalid or unsupported query }
  /graphql/schema:
    get:
      summary: Read-only GraphQL schema (SDL)
      tags: [interop]
      responses:
        '200':
          content:
            text/plain:
              schema: { type: string }
  /interop/shacl/{namespace}:
    get:
      summary: Export an ontology as SHACL Shapes (Turtle)
      description: Concepts become NodeShapes, properties become PropertyShapes (datatype, min/max count, enum, unit comment), and relations become sh:class property shapes. The semantic object model remains authoritative.
      tags: [interop]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, required: false, schema: { type: string }, description: "Defaults to the latest version" }
      responses:
        '200':
          description: SHACL Shapes in Turtle
          content:
            text/turtle:
              schema: { type: string }
        '404': { description: Ontology namespace/version not found }
    post:
      summary: Import SHACL Shapes (Turtle) into an ontology draft
      description: |
        Maps sh:targetClass to concepts, sh:path with sh:datatype/nodeKind,
        minCount/maxCount and sh:in to properties, and sh:class to relations.
        Import is a pure adapter: the returned draft is not written to the
        semantic store. Unsupported constructs are rejected with 400.
      tags: [interop]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, required: false, schema: { type: string }, description: "Draft version label (default imported)" }
      requestBody:
        required: true
        content:
          text/turtle:
            schema: { type: string }
      responses:
        '200':
          description: Ontology draft (not persisted)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ontology' }
        '400': { description: Invalid Turtle/SHACL or payload too large }
  /interop/shacl/{namespace}/validate:
    get:
      summary: Validate stored assertions against ontology constraints
      description: |
        Checks required/single-valued properties, datatypes, enums and relation
        ranges. Unknown concepts and predicates are ignored (open-world). The
        operation is read-only and returns a SHACL-style report.
      tags: [interop]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, required: false, schema: { type: string }, description: "Defaults to the latest version" }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShaclValidationReport' }
        '404': { description: Ontology namespace/version not found }
    post:
      summary: Validate a supplied assertion batch against ontology constraints
      description: An empty body validates stored assertions; otherwise pass `{"assertions":[...]}` or a bare array.
      tags: [interop]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, required: false, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                assertions:
                  type: array
                  items: { $ref: '#/components/schemas/KnowledgeAssertion' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShaclValidationReport' }
        '400': { description: Invalid payload }
  /interop/owl/{namespace}:
    get:
      summary: Export an ontology as OWL 2 Turtle
      description: Concepts become owl:Class, datatype properties become owl:DatatypeProperty with rdfs:domain/range, and relations become owl:ObjectProperty (including owl:inverseOf when declared).
      tags: [interop]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, required: false, schema: { type: string }, description: "Defaults to the latest version" }
      responses:
        '200':
          content:
            text/turtle:
              schema: { type: string }
        '404': { description: Ontology namespace/version not found }
  /interop/owl/{namespace}/infer:
    get:
      summary: Derive a read-only RDFS/OWL RL subset closure
      description: |
        Applies rdfs:domain and rdfs:range typing plus owl:inverseOf over the
        stored assertions. Inferred triples are returned as Turtle with a
        comment naming the rule; nothing is persisted, so the semantic API
        remains unchanged.
      tags: [interop]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, required: false, schema: { type: string }, description: "Defaults to the latest version" }
      responses:
        '200':
          content:
            text/turtle:
              schema: { type: string }
        '404': { description: Ontology namespace/version not found }
  /bridge/{namespace}/contract:
    get:
      summary: Export the signed semantic contract of the latest published ontology
      description: Downstream systems bind to this versioned contract (concepts, properties, units, JSON Schema, DDL, signature) instead of replicating private semantics.
      tags: [bridge]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BridgeContract' }
        '404': { description: No published ontology for the namespace }
  /bridge/query:
    post:
      summary: Run a contract-driven query filtered to the contract's declared predicates
      tags: [bridge]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BridgeQuery' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractView' }
  /events/contracts:
    get:
      summary: List registered event contracts
      tags: [event]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  contracts:
                    type: array
                    items: { $ref: '#/components/schemas/EventContract' }
    post:
      summary: Register an event contract (event type -> assertion templates)
      tags: [event]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventContract' }
      responses:
        '201': { description: Registered }
  /events/ingest:
    post:
      summary: Ingest an event and persist the governed assertions it produces
      description: Subjects are resolved to canonical entities; unresolved hints are stored under the unresolved namespace and reported as gaps. Assertions carry validity windows from the template's validFor.
      tags: [event]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventIngest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestResult' }
        '404': { description: Event contract not found }
  /studio:
    get:
      summary: Read-only Ontology Studio (self-contained HTML)
      description: A no-build, no-external-asset page for model, lineage and usage inspection. All writes still go through Registry, Impact and approval gates.
      tags: [studio]
      responses:
        '200':
          description: Studio HTML page
          content:
            text/html:
              schema: { type: string }
  /studio/model:
    get:
      summary: Read-only Studio model (concepts, relations, lineage, usage counts)
      tags: [studio]
      parameters:
        - { name: namespace, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudioModel' }
        '400': { description: Missing namespace }
        '404': { description: Ontology namespace not found }
  /studio/impact:
    get:
      summary: Read-only Studio change-impact detail (affected items)
      description: Compares the latest version against the currently published version using the same analyzer as the publish guard.
      tags: [studio]
      parameters:
        - { name: namespace, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImpactReport' }
        '400': { description: Missing namespace }
        '404': { description: Ontology namespace not found }
  /metrics:
    get:
      summary: Operational counters (queries, publish, ingest, governance)
      description: Monotonic operation counters for SLO and monitoring. Keyed by stable names like query.semantic / ontology.publish / events.ingested.
      tags: [ops]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts:
                    type: object
                    additionalProperties: { type: integer }
                  asOf: { type: string, format: date-time }
  /metrics/definitions:
    get:
      summary: List governed metric definitions (Metric Ontology)
      description: Metrics are first-class objects (formula, grain, unit, source, owner, version) served to the semantic query executor.
      tags: [metric]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  definitions:
                    type: array
                    items: { $ref: '#/components/schemas/MetricDefinition' }
    post:
      summary: Register a governed metric definition
      tags: [metric]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetricDefinition' }
      responses:
        '201': { description: Registered }
        '409': { description: Duplicate metric id }
  /quality:
    get:
      summary: Aggregated quality/SLO snapshot over the control plane
      description: Citation completeness, unresolved-entity rate, consistency failures/warnings, conflict count and governance activity (audit + approval).
      tags: [ops]
      parameters:
        - { name: ontology, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityReport' }
  /incidents/rules:
    post:
      summary: Register an SLO rule (metric + operator + threshold)
      tags: [ops]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentRule' }
      responses:
        '201': { description: Registered }
  /incidents/check:
    post:
      summary: Evaluate SLO rules against the current quality snapshot
      description: Opens an incident only on the failing edge of a rule; a continuously failing rule does not re-open.
      tags: [ops]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  opened:
                    type: array
                    items: { $ref: '#/components/schemas/Incident' }
                  quality: { $ref: '#/components/schemas/QualityReport' }
  /incidents:
    get:
      summary: List incidents (newest first)
      tags: [ops]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  incidents:
                    type: array
                    items: { $ref: '#/components/schemas/Incident' }
  /incidents/{id}/resolve:
    post:
      summary: Resolve an open incident explicitly
      tags: [ops]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Resolved }
  /industry/packs:
    get:
      summary: List industry reference packs (finance/manufacturing/supply chain/public sector)
      description: Reference semantic contracts for verticals; each parses to a valid, publishable ontology. Adapt per institution; packs are never a substitute for a governed ontology.
      tags: [industry]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  packs:
                    type: array
                    items: { $ref: '#/components/schemas/IndustryPackSummary' }
  /industry/packs/{id}:
    get:
      summary: Get a full industry reference pack (ontology payload included)
      tags: [industry]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IndustryPack' }
        '404': { description: Unknown pack }
  /ontologies/{namespace}/versions/{version}/diff:
    get:
      summary: Semantic diff between two versions of a namespace
      tags: [ontology]
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - { name: other, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes:
                    type: array
                    items: { $ref: '#/components/schemas/Change' }
  /assertions:
    post:
      summary: Propose a knowledge assertion
      tags: [assertion]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeAssertion' }
      responses:
        '201': { description: Created }
    get:
      summary: List assertions for a subject entity
      tags: [assertion]
      parameters:
        - { name: subjectNs, in: query, required: true, schema: { type: string } }
        - { name: subjectId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KnowledgeAssertion' }
  /assertions/{id}:
    get:
      summary: Get an assertion by id
      tags: [assertion]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /entities:
    post:
      summary: Register a canonical entity reference
      tags: [entity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntityRef' }
      responses:
        '201': { description: Created }
  /entities/resolve:
    post:
      summary: Resolve a hint to canonical entity references
      tags: [entity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hint: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EntityRef' }
  /entities/explain:
    post:
      summary: Resolve a hint into a full Resolution (canonical ref, match evidence, relations, gaps)
      tags: [entity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hint: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resolution' }
  /entities/merge-candidate:
    post:
      summary: Propose a merge candidate relation with match evidence (authority=candidate)
      tags: [entity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                left: { $ref: '#/components/schemas/EntityRef' }
                right: { $ref: '#/components/schemas/EntityRef' }
                kind: { type: string, enum: [exactSameAs, similarTo] }
                generatedBy: { type: string, enum: [rule, model, human] }
              required: [left, right]
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  relation: { $ref: '#/components/schemas/Relation' }
                  evidence: { $ref: '#/components/schemas/MatchEvidence' }
  /query/semantic:
    post:
      summary: "Semantic query: intent resolution + joint retrieval + KnowledgeView"
      tags: [query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string, example: "ACME supplier risk in Singapore" }
                principal: { type: string }
                purpose: { type: string, example: "supplier_onboarding" }
              required: [query]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SemanticResult' }
  /query/path:
    post:
      summary: Multi-hop path between two node keys
      tags: [query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from: { type: string, example: "policy:P-1" }
                to: { type: string, example: "process:PR-9" }
              required: [from, to]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Path' }
  /query/subgraph:
    post:
      summary: 1-hop neighborhood of a node
      tags: [query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                node: { type: string, example: "capability:C-2" }
              required: [node]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Relation' }
  /query/hybrid:
    post:
      summary: Hybrid retrieval (BM25 + vector + graph, fused with RRF)
      description: |
        Produces candidate rankings over current concepts and assertions.
        Retrieval never merges identities or promotes candidates; grounding and
        governance remain owned by the semantic query executor. The default
        embedding provider is deterministic and offline; a hosted provider can
        replace it through the embedding SPI.
      tags: [query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string, example: "supplier risk" }
                limit: { type: integer, default: 10 }
                seedDepth: { type: integer, default: 10, description: "seeds per mode for graph expansion" }
                weights: { $ref: '#/components/schemas/HybridWeights' }
              required: [query]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HybridResult' }
        '400': { description: Missing or invalid query }
  /mcp:
    post:
      summary: Model Context Protocol endpoint (JSON-RPC 2.0)
      description: |
        Stateless MCP server exposing the governed semantic tools `ground`,
        `cite`, `search`, `hybrid_search` and `resolve_entity`. Supports the
        `initialize`, `tools/list` and `tools/call` methods. Tool execution
        errors are returned inside the tool result with `isError: true`.
      tags: [agent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPRequest' }
      responses:
        '200':
          description: JSON-RPC response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPResponse' }
        '202': { description: Notification accepted (no response body) }
  /grounding/assemble:
    post:
      summary: Assemble an evidence-backed, purpose-scoped grounding bundle
      tags: [grounding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string, example: "ACME supplier risk in Singapore" }
                principal: { type: string }
                purpose: { type: string, example: "supplier_onboarding" }
                budget: { type: integer, description: "max assertions in knowledge (0 = unlimited)" }
              required: [query]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroundingBundle' }
  /grounding/explain:
    post:
      summary: Citation-level explanation of a grounding assembly
      tags: [grounding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string }
                principal: { type: string }
                purpose: { type: string }
              required: [query]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroundingExplanation' }
  /grounding/redact:
    post:
      summary: Re-assemble with sensitive evidence sources hidden, audit refs kept
      tags: [grounding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string }
                principal: { type: string }
                purpose: { type: string }
                budget: { type: integer }
                hideTags:
                  type: array
                  items: { type: string }
                  description: "policy tags whose evidence sources are redacted"
              required: [query]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroundingBundle' }
  /healthz:
    get:
      summary: Health check with backing store kind and read probe
      description: Returns 200 when healthy; 503 when the configured PostgreSQL store is unreachable.
      tags: [ops]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  store: { type: string, enum: [memory, postgres] }
                  version: { type: string }
                  storeError: { type: string }
        '503': { description: Store degraded }
components:
  schemas:
    Ontology:
      type: object
      properties:
        id: { type: string }
        namespace: { type: string }
        version: { type: string }
        dependencies: { type: array, items: { type: string } }
        status: { type: string, enum: [draft, validated, published, deprecated, revoked] }
        owner: { type: string }
        signature: { type: string }
        concepts:
          type: array
          items: { $ref: '#/components/schemas/Concept' }
        relations:
          type: array
          items: { $ref: '#/components/schemas/RelationSpec' }
        constraints:
          type: array
          items: { $ref: '#/components/schemas/Constraint' }
    OntologyCreateResult:
      type: object
      properties:
        ontology: { $ref: '#/components/schemas/Ontology' }
        issues:
          type: array
          items: { $ref: '#/components/schemas/Issue' }
    Concept:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        label: { type: string }
        definition: { type: string }
        scope: { type: string }
        owner: { type: string }
        properties:
          type: array
          items: { $ref: '#/components/schemas/Property' }
    Property:
      type: object
      properties:
        name: { type: string }
        dataType: { type: string }
        unit: { type: string }
        required: { type: boolean }
        cardinality: { type: string }
        enum: { type: array, items: { type: string } }
    RelationSpec:
      type: object
      properties:
        id: { type: string }
        domain: { type: string }
        range: { type: string }
        roles: { type: array, items: { type: string } }
        cardinality: { type: string }
        inverse: { type: string }
        properties: { type: array, items: { type: string } }
    Constraint:
      type: object
      properties:
        id: { type: string }
        target: { type: string }
        expression: { type: string }
        severity: { type: string, enum: [error, warning, info] }
        message: { type: string }
        version: { type: string }
    Issue:
      type: object
      properties:
        severity: { type: string, enum: [error, warning, info] }
        path: { type: string }
        message: { type: string }
    Change:
      type: object
      properties:
        kind: { type: string, enum: [added, removed, modified] }
        type: { type: string }
        id: { type: string }
        before: { type: string }
        after: { type: string }
        breaking: { type: boolean }
    AffectedAssertion:
      type: object
      properties:
        assertionId: { type: string }
        subject: { $ref: '#/components/schemas/EntityRef' }
        predicate: { type: string }
        ontologyVersion: { type: string }
        reason: { type: string }
    ImpactSummary:
      type: object
      properties:
        changes: { type: integer }
        breaking: { type: integer }
        additive: { type: integer }
        deprecations: { type: integer }
        affectedAssertions: { type: integer }
        affectedEntities: { type: integer }
    ImpactReport:
      type: object
      properties:
        namespace: { type: string }
        fromVersion: { type: string }
        toVersion: { type: string }
        breaking: { type: array, items: { $ref: '#/components/schemas/Change' } }
        additive: { type: array, items: { $ref: '#/components/schemas/Change' } }
        deprecations: { type: array, items: { $ref: '#/components/schemas/Change' } }
        affectedAssertions: { type: array, items: { $ref: '#/components/schemas/AffectedAssertion' } }
        affectedEntities: { type: array, items: { $ref: '#/components/schemas/EntityRef' } }
        blocking: { type: boolean }
    PublishResult:
      type: object
      properties:
        status: { type: string }
        impact: { $ref: '#/components/schemas/ImpactSummary' }
    RuleResult:
      type: object
      properties:
        constraintId: { type: string }
        expression: { type: string }
        assertionId: { type: string }
        passed: { type: boolean }
        severity: { type: string }
        message: { type: string }
    CheckResult:
      type: object
      properties:
        type: { type: string, enum: [lexical, identity, structural, temporal, contextual, inferential, authority] }
        severity: { type: string, enum: [error, warning, info] }
        message: { type: string }
        ref: { type: string }
    ConsistencyReport:
      type: object
      properties:
        rules: { type: array, items: { $ref: '#/components/schemas/RuleResult' } }
        checks: { type: array, items: { $ref: '#/components/schemas/CheckResult' } }
        failures: { type: integer }
        warnings: { type: integer }
    ConsistencyResolution:
      type: object
      properties:
        at: { type: string, format: date-time }
        subject: { $ref: '#/components/schemas/EntityRef' }
        predicate: { type: string }
        winner: { type: string }
        loser: { type: string }
        basis: { type: string }
        escalated: { type: boolean }
        ties: { type: array, items: { type: string } }
    Condition:
      type: object
      properties:
        field: { type: string }
        op: { type: string, enum: [eq, neq, in] }
        values: { type: array, items: { type: string } }
    Policy:
      type: object
      properties:
        id: { type: string }
        effect: { type: string, enum: [allow, deny] }
        actions: { type: array, items: { type: string } }
        resources: { type: array, items: { type: string } }
        conditions: { type: array, items: { $ref: '#/components/schemas/Condition' } }
        callout: { type: string }
    PolicyRequest:
      type: object
      properties:
        principal: { type: string }
        action: { type: string }
        resource: { type: string }
        tenant: { type: string }
        region: { type: string }
        attributes: { type: object, additionalProperties: { type: string } }
      required: [action]
    PolicyDecision:
      type: object
      properties:
        allowed: { type: boolean }
        reason: { type: string }
        policies: { type: array, items: { type: string } }
    ApprovalStep:
      type: object
      properties:
        role: { type: string, enum: [domain-owner, steward, security] }
        status: { type: string, enum: [pending, approved, rejected] }
        approver: { type: string }
        comment: { type: string }
        at: { type: string, format: date-time }
      required: [role, status]
    ApprovalRequest:
      type: object
      properties:
        id: { type: string }
        action: { type: string }
        resource: { type: string }
        requester: { type: string }
        reason: { type: string }
        steps: { type: array, items: { $ref: '#/components/schemas/ApprovalStep' } }
        status: { type: string, enum: [pending, approved, rejected] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ApprovalCreate:
      type: object
      properties:
        action: { type: string }
        resource: { type: string }
        requester: { type: string }
        reason: { type: string }
      required: [action, resource]
    AuditEvidence:
      type: object
      properties:
        ref: { type: string }
        digest: { type: string }
        attestedAt: { type: string, format: date-time }
        by: { type: string }
    AuditEntry:
      type: object
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        resource: { type: string }
        outcome: { type: string }
        detail: { type: string }
        evidence: { type: array, items: { $ref: '#/components/schemas/AuditEvidence' } }
    AuditAttest:
      type: object
      properties:
        entryId: { type: string }
        ref: { type: string }
        content: { type: string }
        by: { type: string }
      required: [entryId, ref, content]
    PipelineRequest:
      type: object
      properties:
        namespace: { type: string }
        version: { type: string }
        principal: { type: string }
        approvalId: { type: string }
        requireApproval: { type: boolean }
        maxFailures: { type: integer }
        autoRollback: { type: boolean }
      required: [namespace, version]
    PipelineStage:
      type: object
      properties:
        stage: { type: string, enum: [test, publish, observe, rollback] }
        status: { type: string, enum: [passed, failed, skipped, rolled-back] }
        detail: { type: string }
    PipelineReport:
      type: object
      properties:
        namespace: { type: string }
        version: { type: string }
        finalStatus: { type: string, enum: [deployed, rolled-back, blocked, failed, degraded] }
        stages: { type: array, items: { $ref: '#/components/schemas/PipelineStage' } }
    FederatedQuery:
      type: object
      properties:
        query: { type: string }
        principal: { type: string }
        purpose: { type: string }
      required: [query]
    FederatedView:
      type: object
      properties:
        query: { type: string }
        purpose: { type: string }
        asOf: { type: string, format: date-time }
        assertions: { type: array, items: { $ref: '#/components/schemas/KnowledgeAssertion' } }
        conflicts: { type: array, items: { $ref: '#/components/schemas/Conflict' } }
        gaps: { type: array, items: { type: string } }
        domainHits: { type: object, additionalProperties: { type: integer } }
        domainOf: { type: object, additionalProperties: { type: string } }
        domainLatency: { type: object, additionalProperties: { type: integer } }
        policyDecision: { type: string }
