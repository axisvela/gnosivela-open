        severity: { type: string }
        message: { type: string }
      required: [id, metric, operator, threshold]
    Incident:
      type: object
      properties:
        id: { type: string }
        rule: { type: string }
        metric: { type: string }
        value: { type: number }
        opened: { type: string, format: date-time }
        closed: { type: string, format: date-time }
        status: { type: string, enum: [open, resolved] }
        message: { type: string }
    IndustryPackSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        domain: { type: string }
        concepts: { type: array, items: { type: string } }
        assertions: { type: array, items: { type: string } }
        ontologyId: { type: string }
    IndustryPack:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        domain: { type: string }
        concepts: { type: array, items: { type: string } }
        assertions: { type: array, items: { type: string } }
        ontologyId: { type: string }
        ontology: { $ref: '#/components/schemas/Ontology' }
    EntityRef:
      type: object
      properties:
        namespace: { type: string }
        canonicalId: { type: string }
        type: { type: string }
        aliases: { type: array, items: { type: string } }
        authority: { type: string }
      required: [namespace, canonicalId]
    Relation:
      type: object
      properties:
        id: { type: string }
        from: { $ref: '#/components/schemas/EntityRef' }
        to: { $ref: '#/components/schemas/EntityRef' }
