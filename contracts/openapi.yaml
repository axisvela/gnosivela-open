      required: [source]
    SemanticContract:
      type: object
      properties:
        ontologyVersion: { type: string }
        mappingVersion: { type: string }
        units: { type: array, items: { type: string } }
    GroundingBundle:
      type: object
      properties:
        resolvedIntent: { type: string }
